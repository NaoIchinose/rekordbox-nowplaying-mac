<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>NOW PLAYING</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
  .card {
    position:absolute; left:32px;
    display:flex; align-items:center; gap:16px;
    background:rgba(10,10,16,.78); border:1px solid rgba(255,255,255,.18);
    border-radius:14px; padding:16px 22px 16px 18px; color:#fff;
    box-shadow:0 8px 30px rgba(0,0,0,.45);
    opacity:0; transform:translateY(8px);
    transition:opacity .45s ease, transform .45s ease;
    max-width:70vw;
  }
  .card.show { opacity:1; transform:translateY(0); }
  #nowCard { bottom:32px; }
  #nextCard { bottom:158px; padding:10px 18px 10px 14px; background:rgba(10,10,16,.62); }
  .art {
    width:84px; height:84px; border-radius:10px; flex:0 0 auto; position:relative; overflow:hidden;
    background:linear-gradient(135deg,#3a3f6b,#7a3a6b);
    display:flex; align-items:center; justify-content:center;
    font-size:30px; color:rgba(255,255,255,.85);
  }
  .art img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
  .work { font-size:12px; color:#8fd3ff; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #nextCard .art { width:52px; height:52px; font-size:20px; border-radius:8px; }
  .label { font-size:11px; letter-spacing:.28em; color:#ffb86b; margin-bottom:4px; }
  #nextCard .label { color:#8fd3ff; }
  #title { font-size:26px; font-weight:700; line-height:1.25;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #nextTitle { font-size:18px; font-weight:700; line-height:1.25;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .artist { font-size:16px; color:rgba(255,255,255,.82); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #nextCard .artist { font-size:13px; }
  .meta { font-size:12px; color:rgba(255,255,255,.55); margin-top:4px; }
  #progressBar { height:4px; background:rgba(255,255,255,.16); border-radius:2px; margin-top:8px; width:340px; max-width:60vw; }
  #progressFill { height:100%; background:#ffb86b; border-radius:2px; width:0%; transition:width .8s linear; }
  #faders {
    position:absolute; left:32px; bottom:240px; display:none; gap:14px;
    color:rgba(255,255,255,.75); font-size:10px; letter-spacing:.08em;
  }
  .fader { width:90px; }
  .fader .bar { height:5px; background:rgba(255,255,255,.18); border-radius:3px; margin-top:3px; }
  .fader .fill { height:100%; background:#ffb86b; border-radius:3px; width:0%; }
  #crossFill { background:#8fd3ff; }
</style>
</head>
<body>
<div id="nextCard" class="card">
  <div class="art"><span>»</span><img id="nextArtImg" alt=""></div>
  <div>
    <div class="label">NEXT</div>
    <div id="nextTitle">—</div>
    <div id="nextArtist" class="artist"></div>
  </div>
</div>

<div id="faders">
  <div class="fader">CH1<div class="bar"><div id="ch1Fill" class="fill"></div></div></div>
  <div class="fader">CROSS<div class="bar"><div id="crossFill" class="fill"></div></div></div>
  <div class="fader">CH2<div class="bar"><div id="ch2Fill" class="fill"></div></div></div>
</div>

<div id="nowCard" class="card">
  <div class="art"><span>♪</span><img id="artImg" alt=""></div>
  <div>
    <div class="label">NOW PLAYING</div>
    <div id="title">—</div>
    <div id="artist" class="artist"></div>
    <div id="work" class="work"></div>
    <div id="meta" class="meta"></div>
    <div id="progressBar"><div id="progressFill"></div></div>
  </div>
</div>

<script>
  const el = id => document.getElementById(id);
  const nowCard = el('nowCard'), nextCard = el('nextCard'), faders = el('faders');
  let lastNow = '', lastNext = '';
  function setFill(id, v) { if (v !== null && v !== undefined) el(id).style.width = (v / 127 * 100) + '%'; }
  function fmt(sec) {
    if (sec === null || sec === undefined) return '--:--';
    sec = Math.max(0, Math.round(sec));
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }
  async function tick() {
    try {
      const r = await fetch('/api', { cache: 'no-store' });
      const s = await r.json();
      const deck = s.on_air ? s.decks[s.on_air] : null;
      if (s.status === 'ok' && deck && deck.title) {
        const key = deck.title + '|' + (deck.artist || '');
        if (key !== lastNow) {
          lastNow = key;
          el('title').textContent = deck.title;
          el('artist').textContent = deck.artist || '';
        }
        el('work').textContent = deck.work || '';
        const artImg = el('artImg');
        if (deck.artwork) {
          if (artImg.getAttribute('src') !== deck.artwork) artImg.src = deck.artwork;
          artImg.style.display = 'block';
        } else {
          artImg.style.display = 'none';
        }
        el('meta').textContent =
          (deck.bpm ? 'BPM ' + deck.bpm + '　' : '') + 'DECK ' + s.on_air +
          '　' + fmt(deck.position_sec) + ' / ' + fmt(deck.duration_sec) +
          (deck.remaining_sec != null ? '　(-' + fmt(deck.remaining_sec) + ')' : '') +
          (deck.playing === false ? '　(STOP)' : '');
        el('progressFill').style.width =
          (deck.progress != null ? deck.progress * 100 : 0) + '%';
        nowCard.classList.add('show');
      } else {
        nowCard.classList.remove('show');
      }
      if (s.next && s.next.title) {
        const nkey = s.next.title + '|' + (s.next.artist || '');
        if (nkey !== lastNext) {
          lastNext = nkey;
          el('nextTitle').textContent = s.next.title;
          el('nextArtist').textContent = (s.next.artist || '') +
            (s.next.duration_sec != null ? '　' + fmt(s.next.duration_sec) : '');
          const nImg = el('nextArtImg');
          if (s.next.artwork) {
            if (nImg.getAttribute('src') !== s.next.artwork) nImg.src = s.next.artwork;
            nImg.style.display = 'block';
          } else {
            nImg.style.display = 'none';
          }
        }
        nextCard.classList.add('show');
      } else {
        nextCard.classList.remove('show');
      }
      if (s.faders && (s.faders.ch1 !== null || s.faders.cross !== null)) {
        faders.style.display = 'flex';
        setFill('ch1Fill', s.faders.ch1);
        setFill('ch2Fill', s.faders.ch2);
        setFill('crossFill', s.faders.cross);
      } else {
        faders.style.display = 'none';
      }
    } catch (e) {
      nowCard.classList.remove('show');
      nextCard.classList.remove('show');
      faders.style.display = 'none';
    }
  }
  setInterval(tick, 1000);
  tick();
</script>
</body>
</html>
